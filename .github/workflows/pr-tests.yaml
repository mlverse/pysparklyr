on:
  pull_request:
    branches: main
    paths:
      - '.github/workflows/pr-tests.yaml'
      - 'R/**'
      - 'tests/**'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - 'man/**'
      - 'inst/**'
      - 'src/**'

name: PR-Tests

jobs:
  PR-Tests:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    name: ${{ matrix.config.name }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - {spark: '4.1.2', pyspark: '4.1.2', hadoop: '3', scala: '2.13', python: '3.13', java: '21', name: 'PySpark 4'}
          - {sail: '0.7', python: '3.12', name: 'Sail 0.7'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      SPARK_VERSION:   ${{ matrix.config.spark }}
      HADOOP_VERSION:  ${{ matrix.config.hadoop }}
      PYSPARK_VERSION: ${{ matrix.config.pyspark }}
      PYTHON_VERSION:  ${{ matrix.config.python }}
      SCALA_VERSION:   ${{ matrix.config.scala }}
      SAIL_VERSION:    ${{ matrix.config.sail }}

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v4
        if: matrix.config.java
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.config.java }}

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::devtools
            any::arrow
            any::tidymodels
            any::probably
            any::rpart
            any::connectcreds
          needs: check

      - name: Cache Spark
        id: cache-spark
        if: matrix.config.spark
        uses: actions/cache@v3
        with:
          path: /home/runner/spark/spark-${{ matrix.config.spark }}-bin-hadoop${{ matrix.config.hadoop }}
          key: sparklyr-spark-${{ matrix.config.spark }}-bin-hadoop${{ matrix.config.hadoop }}

      - name: Install Spark (via sparklyr)
        if: matrix.config.spark && steps.cache-spark.outputs.cache-hit != 'true'
        run: |
          devtools::load_all()
          library(sparklyr)
          spark_install(
            version = Sys.getenv("SPARK_VERSION"),
            hadoop_version = Sys.getenv("HADOOP_VERSION")
            )
        shell: Rscript {0}

      - name: R Installed Packages
        run: |
          m_pkgs <- installed.packages()
          t_pkgs <- as.data.frame(m_pkgs, row.names = FALSE)
          print(t_pkgs[, c("Package", "Version")])
        shell: Rscript {0}

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.config.python }}

      - run: python --version

      - name: R Tests
        run: |
          devtools::load_all()
          devtools::test(reporter = sparklyr_reporter())
        shell: Rscript {0}
