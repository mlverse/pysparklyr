on:
  push:
    branches: main
    paths:
      - '.github/workflows/sail-tests.yaml'
      - 'R/**'
      - 'tests/**'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - 'man/**'
      - 'inst/**'
      - 'src/**'
  pull_request:
    branches: main
    paths:
      - '.github/workflows/sail-tests.yaml'
      - 'R/**'
      - 'tests/**'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - 'man/**'
      - 'inst/**'
      - 'src/**'

name: Sail

jobs:
  Sail-Tests:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    name: ${{ matrix.config.name }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - {sail: '0.7', python: '3.12', name: 'Sail 0.7'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      SAIL_VERSION:   ${{ matrix.config.sail }}
      PYTHON_VERSION: ${{ matrix.config.python }}

    steps:
      - uses: actions/checkout@v3

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::devtools
          needs: check

      - name: R Session Info
        run: sessionInfo()
        shell: Rscript {0}

      - name: R Environment Variables
        run: Sys.getenv()
        shell: Rscript {0}

      - name: R Installed Packages
        run: |
          m_pkgs <- installed.packages()
          t_pkgs <- as.data.frame(m_pkgs, row.names = FALSE)
          print(t_pkgs[, c("Package", "Version")])
        shell: Rscript {0}

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.config.python }}

      - run: python --version

      - name: R Tests
        run: |
          devtools::load_all()
          devtools::test(reporter = sparklyr_reporter())
        shell: Rscript {0}
